[package]
name = "arcanum"
version = "1.0.4"
edition = "2021"
authors = ["Gryphon"]
build = "build.rs"

[lib]
name = "arcanum_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
live-m8-eval = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17.14"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "net", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
zeroize = "1.9"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
